# Git hooks for this repo, managed by lefthook (https://lefthook.dev).
# `npm install` installs them. This file is the one place to edit hook logic:
# git runs it on every commit, and CI runs the same commands on every PR.
#
# Checks run at commit time on the staged files: that list is exact, so a
# commit is never blocked by a file it does not touch. rumdl's fixes go into
# the same commit. Skip once with `LEFTHOOK=0 git commit`; CI still checks.

# Finds node and this checkout's lefthook, or skips with a note when the
# checks cannot run here (no `npm install` yet). CI still checks the PR.
rc: scripts/hook-env.sh

pre-commit:
  # Locally rumdl's fixes are staged into the commit. In CI nothing may change.
  fail_on_changes: ci
  commands:
    markdown:
      glob: "*.md"
      # The npm-pinned rumdl only, never a global one: versions format
      # differently and would reformat files inconsistently.
      run: node_modules/.bin/rumdl check --fix {staged_files}
      stage_fixed: true
      priority: 1
    rules:
      # Authoring standard for the rules this commit touches, so a commit is
      # blocked by its own rules, never by pre-existing ones.
      glob: "docs/rules/*.md"
      run: node scripts/check-rules.mjs --rules {staged_files}
      priority: 2
    rules-system:
      # Cross-file invariants (dependencies, index, reachability) over the whole
      # tree, whenever a doc changes. No file list on purpose: lefthook then
      # also runs this for a commit that only deletes a doc, which is exactly
      # what breaks these invariants. `--rules` with no names keeps the
      # authoring standard out of scope.
      glob:
        - "docs/**"
        - "README.md"
      run: node scripts/check-rules.mjs --rules
      priority: 3
